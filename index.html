document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ames pulse{0%,100%{box-shadow:0 0 0 0 rgba(122,231,255,.5)}70%{box-shadow:0 0 0 8px rgba(122,231,255,0)}}\n@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}\n\n/* ── Nav ── */\nnav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:20px 64px;border-bottom:1px solid rgba(122,231,255,.07);background:rgba(21,10,38,.82);backdrop-filter:blur(12px)}\n.brand{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;color:#ff5fd2}\n.nav-links{display:flex;gap:36px;align-items:center}\n.nav-links a{font-family:'JetBrains Mono',monospace;font-size:11px;color:#a08fc0;letter-spacing:.1em;text-decoration:none;transition:color .2s}\n.nav-links a:hover{color:#ff5fd2}\n.status{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#a08fc0}\n.dot{width:7px;height:7px;border-radius:50%;background:#7ae7ff;animation:pulse 2.5s infinite;flex-shrink:0}\n\n/* ── Hero ── */\n.hero{position:relative;z-index:1;padding:72px 64px 56px;max-width:1280px;margin:0 auto;animation:fadein .6s ease both}\n.prompt{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(122,231,255,.62);letter-spacing:.15em;margin-bottom:14px}\n.title{font-size:clamp(64px,9vw,120px);font-weight:700;line-height:.86;letter-spacing:-.04em;color:#f6e9ff;margin-bottom:6px}\n.acc{background:linear-gradient(100deg,#ff5fd2 0%,#c86bff 45%,#7ae7ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,95,210,.45))}\n.cursor{display:inline-block;width:5px;height:clamp(52px,7vw,96px);background:#ff5fd2;box-shadow:0 0 14px #ff5fd2;animation:blink 1.1s step-end infinite;vertical-align:bottom;margin-bottom:6px;margin-left:4px}\n.sub{font-size:16px;color:#b3a2cf;line-height:1.7;max-width:560px;margin:28px 0 32px;font-weight:300}\n.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:48px}\n.btn-primary{font- act-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:24px}\n.contact-copy{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(122,231,255,.62);letter-spacing:.12em}\n.contact-email{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:#ff5fd2;text-decoration:none;letter-spacing:-.01em;transition:text-shadow .2s}\n.contact-email:hover{text-shadow:0 0 24px rgba(255,95,210,.6)}\n.contact-links{display:flex;gap:12px;flex-wrap:wrap}\n\n/* ── Card links ── */\n.clinks{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid rgba(122,231,255,.08)}\n.clink{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;padding:7px 12px;border:1px solid rgba(122,231,255,.28);color:rgba(122,231,255,.8);text-decoration:none;transition:background .2s,color .2s}\n.clink:hover{background:rgba(255,95,210,.1);color:#ff5fd2}\n.clink-sec{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;padding:7px 12px;border:1px solid rgba(226,196,255,.18);color:#a08fc0;text-decoration:none;transition:color .2s,border-color .2s}\n.clink-sec:hover{color:#dccdf0;border-color:rgba(226,196,255,.38)}\n.cdesc-note{color:rgba(251,191,36,.9)}\n.cdesc-note::before{content:'! ';font-weight:600}\n\n/* ── Python projects ── */\n.oss{position:relative;z-index:1;padding:48px 64px;max-width:1280px;margin:0 auto;border-top:1px solid rgba(122,231,255,.06)}\n.oss-note{font-size:14px;color:#a08fc0;line-height:1.7;font-weight:300;max-width:620px;margin-bottom:28px}\n.oss-note a{color:#ff5fd2;text-decoration:none;border-bottom:1px solid rgba(255,95,210,.3)}\n.oss-note a:hover{border-bottom-color:#ff5fd2}\n.vid{position:relative;width:calc(100% + 48px);margin:-24px -24px 16px;aspect-ratio:16/9;background:#0d0618;border-bottom:1px solid rgba(122,231,255,.12)}\n.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}\n\n/* ── Credentials ── */\n.creds{position:relative;z-i r{border-bottom-color:#ff5fd2}\n\n/* ── Responsive ── */\n@media(max-width:768px){\n  nav{padding:16px 24px}\n  .nav-links{display:none}\n  .hero{padding:48px 24px 40px}\n  .projects{padding:40px 24px}\n  .about{padding:40px 24px}\n  .about-grid{grid-template-columns:1fr;gap:32px}\n  .oss{padding:40px 24px}\n  .creds{padding:40px 24px}\n  .contact{padding:40px 24px}\n  footer{padding:32px 24px}\n  .meta{gap:28px}\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<div class=\"bg-grid\"><\u002Fdiv>\n<div class=\"bg-glow\"><\u002Fdiv>\n<div class=\"bg-scan\"><\u002Fdiv>\n\n<nav>\n  <span class=\"brand\">KH.portfolio<\u002Fspan>\n  <div class=\"nav-links\">\n    <a href=\"#about\">./about<\u002Fa>\n    <a href=\"#demos\">./foundry<\u002Fa>\n    <a href=\"#python\">./python<\u002Fa>\n    <a href=\"#credentials\">./credentials<\u002Fa>\n    <a href=\"#contact\">./contact<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"status\">\n    <span class=\"dot\"><\u002Fspan>\n    OPEN_TO_WORK\n  <\u002Fdiv>\n<\u002Fnav>\n\n<section class=\"hero\">\n  <div class=\"prompt\">&gt; ./ship.sh --patent-granted --award-2025 --foundry --13-projects<\u002Fdiv>\n  <div class=\"title\"><span style=\"letter-spacing:0\">$1M+<\u002Fspan><br><span class=\"acc\">SAVED<\u002Fspan><span class=\"cursor\"><\u002Fspan><\u002Fdiv>\n  <p class=\"sub\">US patent holder. 2025 AT&amp;T Connection Award. I took a cloud demand-forecasting platform concept-to-production in under 90 days, standardized 345+ inconsistent datasets, and cut data-entry time 70% migrating a business off spreadsheets — plus Python and data projects I ship on my own time.<\u002Fp>\n  <div class=\"ctas\">\n    <a href=\"#work\" class=\"btn-primary\">$ VIEW_PROJECTS<\u002Fa>\n    <a href=\"Kristen_Hyslope_Resume.pdf\" download=\"\" class=\"btn-sec\">$ DOWNLOAD_RESUME<\u002Fa>\n    <a href=\"https://linkedin.com/in/kchyslope\" target=\"_blank\" rel=\"noopener\" class=\"btn-sec\">↗ LINKEDIN<\u002Fa>\n    <a href=\"https://github.com/kchyslope\" target=\"_blank\" rel=\"noopener\" class=\"btn-sec\">⌥ GITHUB<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"meta\">\n    <div class=\"mi\"><span class=\"ml\">cost savings + avoidance<\u002Fspan><span class=\"mv\">$1M+<\u002Fspan><\u002Fdiv>\n    <div class=\"mi\"><span class=\"ml\">patent granted<\u002Fspan><span class=\"mv\">US 2024<\u002Fspan><\u002Fdiv>\n    <div class=\"mi\"><span class=\"ml\">concept to prod<\u002Fspan><span class=\"mv\">90 DAYS<\u002Fspan><\u002Fdiv>\n    <div class=\"mi\"><span class=\"ml\">data-entry time cut<\u002Fspan><span class=\"mv\">70%<\u002Fspan><\u002Fdiv>\n    <div class=\"mi\"><span class=\"ml\">projects shipped<\u002Fspan><span class=\"mv\">13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"divider\"><\u002Fdiv>\n\n<section class=\"projects\" id=\"work\">\n  <div class=\"section-label\">// FEATURED_PROJECTS<\u002Fdiv>\n  <div class=\"cards\">\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · 2025<\u002Fspan>\n        <span class=\"badge-patent\">US PATENT<\u002Fspan>\n        <span class=\"badge-award\">→ CONNECTION AWARD<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">P1 Services Migration<\u002Fdiv>\n      <div class=\"cdesc\">Legacy Excel to P1 Services (Java, Azure). 70% reduction in data-entry time. 2025 AT&amp;T Connection Award winner.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Java<\u002Fspan>\n        <span class=\"stk\">Azure<\u002Fspan>\n        <span class=\"stk\">Power BI<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · 2017<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Cloud Demand Forecasting Platform<\u002Fdiv>\n      <div class=\"cdesc\">MVP shipped concept-to-production in under 90 days. Standardized 345+ inconsistent historical datasets across 6 pipelines.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">SQL<\u002Fspan>\n        <span class=\"stk\">.NET<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · PALANTIR<\u002Fspan>\n        <span class=\"badge-foundry\">FOUNDRY<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">CI/CD Data Aggregation Pipelines<\u002Fdiv>\n      <div class=\"cdesc\">5 production-grade pipelines with workstream-level error handling. AIP for rapid PySpark debugging and optimization.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">PySpark<\u002Fspan>\n        <span class=\"stk\">Palantir AIP<\u002Fspan>\n        <span class=\"stk\">Bash<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · GOVERNANCE<\u002Fspan>\n        <span class=\"badge-foundry\">FOUNDRY<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Data Governance Data Dictionary<\u002Fdiv>\n      <div class=\"cdesc\">Authored the canonical data ingestion contract, mapping field terminology across five independently managed workstreams to a single master-term standard.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Data Lineage<\u002Fspan>\n        <span class=\"stk\">Medallion<\u002Fspan>\n        <span class=\"stk\">Ontology<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · 2019–2023<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Cloud Planning Dashboard Suite<\u002Fdiv>\n      <div class=\"cdesc\">Five Power BI dashboards with DAX modeling, enterprise-security-compliant semantic models, RBAC-aligned gateways, and one-click export.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Power BI<\u002Fspan>\n        <span class=\"stk\">DAX<\u002Fspan>\n        <span class=\"stk\">Azure SQL<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · 2019–2023<\u002Fspan>\n        <span class=\"badge-award\">→ DROVE TEAM CHANGE<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Delivery Backlog Forensics<\u002Fdiv>\n      <div class=\"cdesc\">Connected to the developer ticketing database via Power Query and surfaced 6–9-month closure averages and untouched 15+-month stories — the data-driven case presented to leadership.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">SQL<\u002Fspan>\n        <span class=\"stk\">Power Query<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · 2014–2016<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Robotic Process Automation Bot<\u002Fdiv>\n      <div class=\"cdesc\">Defined requirements and the use case for an Automation Anywhere RPA bot generating $31,481 in annualized savings over two years.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Automation Anywhere<\u002Fspan>\n        <span class=\"stk\">Visio<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · 2019–2023<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">SharePoint Online Migration<\u002Fdiv>\n      <div class=\"cdesc\">Executed the cloud migration of a SharePoint site collection from on-premises to SharePoint Online, owning risk management planning through cutover.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">SharePoint<\u002Fspan>\n        <span class=\"stk\">Risk Mgmt<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">AT&amp;T · 2012<\u002Fspan>\n        <span class=\"badge-award\">→ SIX SIGMA AWARD<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Stranded Lease Optimization<\u002Fdiv>\n      <div class=\"cdesc\">Applied Six Sigma principles to identify and eliminate tower leases paying rent on space no longer required — $72,000 in annual savings.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Six Sigma<\u002Fspan>\n        <span class=\"stk\">Advanced Excel<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"about\" id=\"about\">\n  <div class=\"section-label\">// ABOUT<\u002Fdiv>\n  <div class=\"about-grid\">\n    <div class=\"about-bio\">\n      <p>I'm a <strong>technical program and product leader<\u002Fstrong> who turns manual, spreadsheet-bound operations into production platforms the enterprise runs on. I spent 22 years at AT&amp;T: twelve owning cloud capacity planning platforms as product owner, program manager, and business process analyst; six in wireless network deployment project management and project controls; and five in sales. I'm a <strong>PMP<\u002Fstrong> and a <strong>Six Sigma Green Belt<\u002Fstrong>, so the delivery discipline matches the technical depth.<\u002Fp>\n      <p>My work spans Palantir Foundry, Azure, SQL, Python, Java, .NET, and Power BI. I delivered the AT&amp;T enterprise cloud capacity planning tool that returned $1 million in annualized savings, then migrated cloud capacity planning from Excel to P1 Services, cutting planner data-entry time 70% and earning a 2025 AT&amp;T Connection Award. I authored the Data Dictionary adopted as the enterprise's canonical data ingestion contract, and I'm the named inventor on <a href=\"https://patents.google.com/patent/US20240422572A1\" target=\"_blank\" rel=\"noopener\">US Patent 2024/0422572 A1<\u002Fa> for the Integrated Network Deployment Tool.<\u002Fp>\n      <p>I take on ambiguous, difficult problems on purpose — the payoff is the moment a messy problem becomes something finished and working. I also don't route around conflict. Trial by fire is how you find the solution that's actually practical for every stakeholder, not just the loudest one.<\u002Fp>\n      <p>I'm currently open to senior data and platform engineering, systems engineering, solutions architecture, and engineering leadership roles — including forward-deployed Foundry work — as well as <strong>consulting engagements<\u002Fstrong>. If the problems are hard and the stakes are real, <a href=\"mailto:kchyslope@icloud.com\">email me<\u002Fa> and let's find a time to talk.<\u002Fp>\n      <div class=\"now\">\n        <div class=\"now-h\">// NOW<\u002Fdiv>\n        <div class=\"now-list\">\n          <div class=\"now-item\">Working through the <a href=\"https://www.freecodecamp.org/learn/python-v9/\" target=\"_blank\" rel=\"noopener\"><strong>freeCodeCamp Python certification<\u002Fstrong><\u002Fa> — 424 of 531 steps down. Closing the gaps between what I've shipped and what I can explain from first principles.<\u002Fdiv>\n          <div class=\"now-item\">Building small Python projects <strong>in the open on GitHub<\u002Fstrong>, so the work speaks before I do.<\u002Fdiv>\n          <div class=\"now-item\">Actively interviewing — in conversation with recruiters, hiring teams, and career coaches about where this goes next.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"about-stats\">\n      <div class=\"astat\"><span class=\"astat-n\">22<\u002Fspan><span class=\"astat-l\">Years at AT&amp;T<\u002Fspan><\u002Fdiv>\n      <div class=\"astat\"><span class=\"astat-n\">12<\u002Fspan><span class=\"astat-l\">Years owning cloud capacity planning platforms<\u002Fspan><\u002Fdiv>\n      <div class=\"astat\"><span class=\"astat-n\">$1M+<\u002Fspan><span class=\"astat-l\">Cost savings &amp; avoidance<\u002Fspan><\u002Fdiv>\n      <div class=\"astat\"><span class=\"astat-n\">1<\u002Fspan><span class=\"astat-l\">US Patent · 2024<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"oss\" id=\"demos\">\n  <div class=\"section-label\">// FOUNDRY_DEMOS<\u002Fdiv>\n  <p class=\"oss-note\">Recorded walkthroughs of Palantir Foundry and AIP work — built on Palantir's training environment and my own sandbox, so there's nothing here I can't show you. No narration, so each write-up below explains what you're watching.<\u002Fp>\n  <div class=\"cards\">\n\n    <div class=\"card\">\n      <div class=\"vid\">\n        <iframe src=\"https://www.youtube.com/embed/8JrdjlbGXqU\" title=\"Your First Agentic Workflow — Foundry demo\" loading=\"lazy\" allow=\"accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen=\"\"><\u002Fiframe>\n      <\u002Fdiv>\n      <div class=\"card-top\">\n        <span class=\"ctag\">PALANTIR LEARN<\u002Fspan>\n        <span class=\"badge-foundry\">AIP<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Your First Agentic Workflow<\u002Fdiv>\n      <div class=\"cdesc\">\n        <p>A Workshop app that automates pharmaceutical trial screening. AIP reads each patient's medical record against the Glycurex trial criteria and the answers given by doctors and patients, then marks them <strong>suitable<\u002Fstrong>, <strong>unsuitable<\u002Fstrong>, or — where the record can't settle it — <strong>flagged for manual review<\u002Fstrong>.<\u002Fp>\n        <p>Reviewers keep the final say: eligibility can be overridden by hand. In the video I flip Vivek Kapoor from Not Suitable to Suitable to show the override path, even though he's above the study's age limit.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"mod-h\">MODULES USED<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Workshop<\u002Fspan>\n        <span class=\"stk\">AIP Logic<\u002Fspan>\n        <span class=\"stk\">AIP Evaluation Suite<\u002Fspan>\n        <span class=\"stk\">Ontology<\u002Fspan>\n        <span class=\"stk\">Automation<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"clinks\">\n        <a class=\"clink\" href=\"https://youtu.be/8JrdjlbGXqU\" target=\"_blank\" rel=\"noopener\">▸ WATCH_ON_YOUTUBE<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"vid\">\n        <iframe src=\"https://www.youtube.com/embed/R9xWDykUbzU\" title=\"AIP Semantic Search App — demo\" loading=\"lazy\" allow=\"accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen=\"\"><\u002Fiframe>\n      <\u002Fdiv>\n      <div class=\"card-top\">\n        <span class=\"ctag\">SELF-DIRECTED<\u002Fspan>\n        <span class=\"badge-foundry\">AIP<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">AIP Semantic Search App<\u002Fdiv>\n      <div class=\"cdesc\">\n        <p>A Workshop app over a corpus of 69 PDFs on distributed, parallel, and cluster computing. Users search the collection in plain language — AIP LLM logic interprets the question and answers from the source documents rather than keyword matching.<\u002Fp>\n        <p>In the video I ask a series of questions with deliberately varying success: one sits right at the edge of the corpus, and one falls entirely outside it, to show how the app behaves when the answer isn't there.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"mod-h\">MODULES USED<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Pipeline Builder<\u002Fspan>\n        <span class=\"stk\">Transforms<\u002Fspan>\n        <span class=\"stk\">AIP Logic<\u002Fspan>\n        <span class=\"stk\">Ontology<\u002Fspan>\n        <span class=\"stk\">Workshop<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"clinks\">\n        <a class=\"clink\" href=\"https://youtu.be/R9xWDykUbzU\" target=\"_blank\" rel=\"noopener\">▸ WATCH_ON_YOUTUBE<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"oss\" id=\"python\">\n  <div class=\"section-label\">// PYTHON_SAMPLE_WORK<\u002Fdiv>\n  <p class=\"oss-note\">Python work outside the day job — a self-directed data project plus course builds, each carried past the original assignment. The browser demo UI on every one of these is mine, not the coursework's.<\u002Fp>\n  <div class=\"cards\">\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">LINKEDIN LEARNING · EXTENDED<\u002Fspan>\n        <span class=\"badge-foundry\">GITHUB ACTION<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Podcast Generator<\u002Fdiv>\n      <div class=\"cdesc\">A Dockerized GitHub Action that turns a YAML manifest into a spec-compliant iTunes RSS feed, paired with a React demo UI that previews the episode list and generated XML side by side as you edit.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Python<\u002Fspan>\n        <span class=\"stk\">Docker<\u002Fspan>\n        <span class=\"stk\">React<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"clinks\">\n        <a href=\"https://kchyslope.github.io/podcast_generator/\" target=\"_blank\" rel=\"noopener\" class=\"clink\">↗ LIVE_DEMO<\u002Fa>\n        <a href=\"https://github.com/kchyslope/podcast_generator\" target=\"_blank\" rel=\"noopener\" class=\"clink-sec\">⌥ CODE<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">SELF-DIRECTED<\u002Fspan>\n        <span class=\"badge-foundry\">DATA SCIENCE<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Streaming Subscriber Analytics<\u002Fdiv>\n      <div class=\"cdesc\">End-to-end subscriber analysis with a GUI-agnostic pipeline: EDA, chi-square and ANOVA hypothesis testing, and a logistic-regression churn-proxy model — surfaced through a filterable Streamlit dashboard and covered by 21 tests. <span class=\"cdesc-note\">Free-tier hosting sleeps when idle — allow ~30s for the demo to wake.<\u002Fspan><\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Python<\u002Fspan>\n        <span class=\"stk\">pandas<\u002Fspan>\n        <span class=\"stk\">Streamlit<\u002Fspan>\n        <span class=\"stk\">Plotly<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"clinks\">\n        <a href=\"https://streaming-subscriber-analytics-kchyslope.streamlit.app/\" target=\"_blank\" rel=\"noopener\" class=\"clink\">↗ LIVE_DEMO<\u002Fa>\n        <a href=\"https://github.com/kchyslope/streaming-subscriber-analytics\" target=\"_blank\" rel=\"noopener\" class=\"clink-sec\">⌥ CODE<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">FREECODECAMP · EXTENDED<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Budget App<\u002Fdiv>\n      <div class=\"cdesc\">Expense-tracking engine with category-based deposits, withdrawals, and inter-category transfers, plus a percentage-spend bar chart — shipped with both a Tkinter GUI and a browser port of the same class.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Python<\u002Fspan>\n        <span class=\"stk\">Tkinter<\u002Fspan>\n        <span class=\"stk\">JavaScript<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"clinks\">\n        <a href=\"https://kchyslope.github.io/budgetapp_fcc/\" target=\"_blank\" rel=\"noopener\" class=\"clink\">↗ LIVE_DEMO<\u002Fa>\n        <a href=\"https://github.com/kchyslope/budgetapp_fcc\" target=\"_blank\" rel=\"noopener\" class=\"clink-sec\">⌥ CODE<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card-top\">\n        <span class=\"ctag\">FREECODECAMP · EXTENDED<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cname\">Polygon Area Calculator<\u002Fdiv>\n      <div class=\"cdesc\">Geometry calculator handling triangles, rectangles, and circles alongside any regular n-sided polygon derived from its side count and length.<\u002Fdiv>\n      <div class=\"stacks\">\n        <span class=\"stk\">Python<\u002Fspan>\n        <span class=\"stk\">OOP<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"clinks\">\n        <a href=\"https://kchyslope.github.io/polygonareacalculator_fcc/\" target=\"_blank\" rel=\"noopener\" class=\"clink\">↗ LIVE_DEMO<\u002Fa>\n        <a href=\"https://github.com/kchyslope/polygonareacalculator_fcc\" target=\"_blank\" rel=\"noopener\" class=\"clink-sec\">⌥ CODE<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"creds\" id=\"credentials\">\n  <div class=\"section-label\">// CREDENTIALS<\u002Fdiv>\n  <div class=\"creds-grid\">\n    <div>\n      <div class=\"cred-col-h\">Patent<\u002Fdiv>\n      <div class=\"cred-list\">\n        <div class=\"cred-item\"><span><strong>Integrated Network Deployment Tool<\u002Fstrong><br>US 2024/0422572 A1 · AT&amp;T Intellectual Property I, L.P. · Published Dec 2024<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div class=\"cred-col-h\">Certifications<\u002Fdiv>\n      <div class=\"cred-list\">\n        <div class=\"cred-item\"><span><strong>PMP®<\u002Fstrong> — Project Management Institute, renewed through 2028<\u002Fspan><\u002Fdiv>\n        <div class=\"cred-item\"><span><strong>Six Sigma Green Belt<\u002Fstrong> — AT&amp;T<\u002Fspan><\u002Fdiv>\n        <div class=\"cred-item\"><span><strong>Palantir Foundry &amp; AIP Builder Foundations<\u002Fstrong><\u002Fspan><\u002Fdiv>\n        <div class=\"cred-item\"><span><strong>Agentic AIP Workflows<\u002Fstrong> — Palantir Technologies<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div class=\"cred-col-h\">Awards<\u002Fdiv>\n      <div class=\"cred-list\">\n        <div class=\"cred-item\"><span><strong>2025 AT&amp;T Connection Award<\u002Fstrong> — $8,000 individual achievement, Excel-to-P1 migration<\u002Fspan><\u002Fdiv>\n        <div class=\"cred-item\
